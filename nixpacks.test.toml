[phases.setup]
nixPkgs = ["bun"]
nixLibs = ["gcc-unwrapped"]

# Node.js comes from its own nixpkgs pin so it can take security releases without
# moving Bun or the rest of the setup (Node.js Oct 2026 security release: 22.23.4).
[phases.node]
nixPkgs = ["nodejs_22"]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = [
  "sudo find /etc/apt -type f \\( -name '*.list' -o -name '*.sources' \\) -exec sed -i 's|http://|https://|g' {} + && sudo apt-get update && sudo apt-get install -y --no-install-recommends libstdc++6 fontconfig fonts-dejavu-core",
  "NODE_ENV=development bun install --frozen-lockfile && cd apps/frontend && NODE_ENV=development bun install --frozen-lockfile --force && rm -rf /root/.cache/nix",
]

[phases.build]
cmds = ["cd apps/frontend && bun run build:test && rm -rf /root/.bun/install/cache /tmp/*"]

[start]
cmd = "cd apps/frontend && bun run serve"

[variables]
NODE_ENV = "production"
