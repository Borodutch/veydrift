[phases.setup]
nixPkgs = []
nixLibs = ["gcc-unwrapped"]

# Node.js and Bun come from their own nixpkgs pin so they can take security
# releases without moving the rest of the setup (Node.js Oct 2026 security
# release: 22.23.4). nixpkgs only has Bun 1.3.13 at this pin, so its bun package
# is pointed at the official Bun 1.4.4 release (Oct 2026 security fixes); drop
# the override once nixpkgs has bun >= 1.4.4.
[phases.node]
nixPkgs = [
  "nodejs_22",
  "(bun.overrideAttrs { version = \"1.4.4\"; src = fetchurl { url = \"https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip\"; hash = \"sha256-v4zL+ysLgBWeD5ptFcVTF63YB3U028YTCj7bUvzLOVw=\"; }; })",
]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = [
  "sudo find /etc/apt -type f \\( -name '*.list' -o -name '*.sources' \\) -exec sed -i 's|http://|https://|g' {} + && sudo apt-get update && sudo apt-get install -y --no-install-recommends libstdc++6 fontconfig fonts-dejavu-core",
  "NODE_ENV=development bun install --frozen-lockfile && cd apps/frontend && NODE_ENV=development bun install --frozen-lockfile --force && rm -rf /root/.cache/nix",
]

[phases.build]
cmds = ["cd apps/frontend && bun run build:test && rm -rf /root/.bun/install/cache /tmp/*"]

[start]
cmd = "cd apps/frontend && bun run serve"

[variables]
NODE_ENV = "production"
