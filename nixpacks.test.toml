[phases.setup]
nixPkgs = ["nodejs_22", "bun"]
nixLibs = ["gcc-unwrapped"]
aptPkgs = ["libstdc++6", "fontconfig", "fonts-dejavu-core"]

[phases.install]
cmds = ["NODE_ENV=development bun install --frozen-lockfile && cd apps/frontend && NODE_ENV=development bun install --frozen-lockfile --force && rm -rf /root/.cache/nix"]

[phases.build]
cmds = ["cd apps/frontend && bun run build:test && rm -rf /root/.bun/install/cache /tmp/*"]

[start]
cmd = "cd apps/frontend && bun run serve"

[variables]
NODE_ENV = "production"
