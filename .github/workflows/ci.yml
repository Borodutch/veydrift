name: CI

on:
  pull_request:
  push:
    branches:
      - main

# One self-hosted runner serves every PR: a new push to a PR cancels that PR's
# superseded run instead of queueing behind it. Pushes to main are never cancelled,
# because every merge commit's run gates deployment and contract releases.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Checks run as parallel jobs on GitHub-hosted runners (free for this public repository),
  # so a run takes as long as its slowest group instead of the sum of every check.
  checks:
    name: checks (${{ matrix.group }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: rest
          - group: build
          - group: browser
          - group: contracts-test
            shard: 1/3
          - group: contracts-test
            shard: 2/3
          - group: contracts-test
            shard: 3/3
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test CI scope and output guards
        if: matrix.group == 'rest'
        run: node --test scripts/ci-run-scoped-checks.test.mjs

      - name: Determine changed areas
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          node scripts/ci-scope.mjs --github-output "$GITHUB_OUTPUT"

      - name: Plan this group's checks
        id: plan
        env:
          CI_SCOPE_FRONTEND: ${{ steps.scope.outputs.frontend }}
          CI_SCOPE_BACKEND: ${{ steps.scope.outputs.backend }}
          CI_SCOPE_UNIVERSE: ${{ steps.scope.outputs.universe }}
          CI_SCOPE_CONTRACTS: ${{ steps.scope.outputs.contracts }}
          CI_SCOPE_STORAGE_LAYOUT: ${{ steps.scope.outputs.storage_layout }}
          CI_SCOPE_FULL_BUILD: ${{ steps.scope.outputs.full_build }}
        run: |
          planned="$(node scripts/ci-run-scoped-checks.mjs --group "${{ matrix.group }}" --list | grep -v ' (Skipped' || true)"
          echo "$planned"
          needs_packages="$(printf '%s\n' "$planned" | grep -v -e '^docs-' -e '^$' || true)"
          echo "work=$([ -n "$planned" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "packages=$([ -n "$needs_packages" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.plan.outputs.packages == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.42

      - name: Cache Bun packages
        if: steps.plan.outputs.packages == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Set up Foundry
        if: steps.plan.outputs.packages == 'true' && steps.scope.outputs.contracts == 'true'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Cache Foundry build artifacts
        if: steps.plan.outputs.packages == 'true' && steps.scope.outputs.contracts == 'true'
        uses: actions/cache@v4
        with:
          path: |
            packages/contracts/cache
            packages/contracts/out
          key: foundry-${{ runner.os }}-${{ hashFiles('packages/contracts/src/**/*.sol', 'packages/contracts/test/**/*.sol', 'packages/contracts/foundry.toml') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Install dependencies
        if: steps.plan.outputs.packages == 'true'
        run: bun install --frozen-lockfile

      - name: Run scoped checks
        if: steps.plan.outputs.work == 'true'
        env:
          CI_SCOPE_FRONTEND: ${{ steps.scope.outputs.frontend }}
          CI_SCOPE_BACKEND: ${{ steps.scope.outputs.backend }}
          CI_SCOPE_UNIVERSE: ${{ steps.scope.outputs.universe }}
          CI_SCOPE_CONTRACTS: ${{ steps.scope.outputs.contracts }}
          CI_SCOPE_STORAGE_LAYOUT: ${{ steps.scope.outputs.storage_layout }}
          CI_SCOPE_FULL_BUILD: ${{ steps.scope.outputs.full_build }}
          CONTRACT_TEST_SHARD: ${{ matrix.shard }}
        run: |
          node scripts/ci-run-scoped-checks.mjs --group "${{ matrix.group }}"

  # Branch protection requires this single "check" status; it passes only if every group passed.
  check:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All check groups passed
        run: test "${{ needs.checks.result }}" = success
