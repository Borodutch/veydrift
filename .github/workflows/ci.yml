name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to a PR cancels that PR's superseded run. Pushes to main are never cancelled,
# because every merge commit's run gates deployment and contract releases.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Check groups run as parallel jobs (one per Mac runner instance), so a run takes as long
  # as its slowest group instead of the sum of every check.
  # The job id must stay `check`: the Mac runners' job-started hook only authorizes job `check`
  # of this workflow, on pull_request events, for PRs authored by backmeupplz.
  check:
    name: checks (${{ matrix.group }})
    # Same rule as that hook, so other PRs (forks, other authors) and main pushes use
    # GitHub-hosted runners instead of being denied on the Mac.
    # Each group has its own Mac runner (label veydrift-ci-<group>), so it always lands in the
    # workspace it warmed last time: node_modules, Foundry artifacts, animation variants.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'backmeupplz') && fromJSON(format('["veydrift-backmeupplz-ci","veydrift-ci-{0}"]', matrix.group)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: rest
          - group: browser
          - group: contracts
          - group: contracts-checks
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BASE_REF: ${{ github.base_ref }}
      BEFORE_SHA: ${{ github.event.before }}
      HEAD_REF: ${{ github.sha }}
    steps:
      # Self-hosted workspaces persist between runs: keep ignored build outputs (node_modules,
      # Foundry out/cache, animation variants) warm, but drop any other untracked leftovers.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          clean: false

      - name: Remove untracked files from previous runs
        run: git clean -ffd -q && git submodule foreach --recursive git clean -ffd -q

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test CI scope and output guards
        if: matrix.group == 'rest'
        run: node --test scripts/ci-run-scoped-checks.test.mjs

      # PRs and pushes to main use the same rule: only the areas a change touches (plus
      # what depends on them) are checked; toolchain/CI/unclassified changes check everything.
      - name: Plan this group's checks
        id: plan
        run: |
          node scripts/ci-scope.mjs
          planned="$(node scripts/ci-run-scoped-checks.mjs --group "${{ matrix.group }}" --list | grep -v ' (Skipped' || true)"
          echo "$planned"
          needs_packages="$(printf '%s\n' "$planned" | grep -v -e '^docs-' -e '^$' || true)"
          echo "work=$([ -n "$needs_packages" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docs=$([ -n "$planned" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "foundry=$(printf '%s\n' "$planned" | grep -q '^contracts-' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(printf '%s\n' "$planned" | grep -q '^frontend-' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.plan.outputs.work == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.42

      - name: Cache Bun packages
        if: steps.plan.outputs.work == 'true' && runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Set up Foundry
        if: steps.plan.outputs.foundry == 'true' && runner.environment == 'github-hosted'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # The Mac runners share one ~/.foundry; installing it from concurrent jobs races.
      - name: Use the Mac's Foundry
        if: steps.plan.outputs.foundry == 'true' && runner.environment != 'github-hosted'
        run: |
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          "$HOME/.foundry/bin/forge" --version | grep -q 'Version: 1.7.1' \
            || { echo "::error::Install Foundry 1.7.1 on this runner: foundryup --install 1.7.1"; exit 1; }

      # Hosted runners only (fork PRs). Keyed per job: a key shared with jobs that compile less
      # once let a near-empty cache win for everyone.
      - name: Cache Foundry build artifacts
        if: steps.plan.outputs.foundry == 'true' && matrix.group == 'contracts' && runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: |
            packages/contracts/cache
            packages/contracts/out
          key: foundry-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('packages/contracts/src/**/*.sol', 'packages/contracts/test/**/*.sol', 'packages/contracts/script/**/*.sol', 'packages/contracts/foundry.toml') }}
          restore-keys: |
            foundry-${{ runner.os }}-${{ matrix.group }}-

      # Generated animated-planet derivatives take minutes to encode from scratch.
      - name: Cache frontend animation variants
        if: steps.plan.outputs.frontend == 'true' && runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: apps/frontend/.animation-variants
          key: animation-variants-${{ runner.os }}-${{ hashFiles('apps/frontend/planetAnimationConfig.ts', 'apps/frontend/scripts/animation-variants.mjs', 'apps/frontend/public/assets/game/planet-animations/**', 'apps/frontend/public/assets/game/moon-animations/**', 'bun.lockb') }}
          restore-keys: |
            animation-variants-${{ runner.os }}-

      - name: Install dependencies
        if: steps.plan.outputs.work == 'true'
        run: bun install --frozen-lockfile

      - name: Run scoped checks
        if: steps.plan.outputs.docs == 'true'
        run: |
          node scripts/ci-run-scoped-checks.mjs --group "${{ matrix.group }}"

  # Branch protection requires this single "check" status; it passes only if every group passed.
  all-checks:
    name: check
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All check groups passed
        run: test "${{ needs.check.result }}" = success
