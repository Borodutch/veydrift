name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.42

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        shell: bash
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/check.log"
          bun run check 2>&1 | tee "$log"

          if grep -Eiq '(^|[^[:alpha:]])(warning|warn:|error:)' "$log"; then
            echo "::error::Check output contains warnings or errors."
            exit 1
          fi

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/test.log"
          bun run test 2>&1 | tee "$log"

          if grep -Eiq '(^|[^[:alpha:]])(warning|warn:|error:)' "$log"; then
            echo "::error::Test output contains warnings or errors."
            exit 1
          fi

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/build.log"
          bun run build 2>&1 | tee "$log"

          if grep -Eiq '(^|[^[:alpha:]])(warning|warn:|error:)' "$log"; then
            echo "::error::Build output contains warnings or errors."
            exit 1
          fi
