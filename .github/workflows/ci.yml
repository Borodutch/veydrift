name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'backmeupplz' && github.event.pull_request.user.id == 3192028 && vars.VEYDRIFT_LOCAL_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Determine changed areas
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          node scripts/ci-scope.mjs --github-output "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.scope.outputs.any_package_check == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.42

      - name: Cache Bun packages
        if: steps.scope.outputs.any_package_check == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Set up Foundry
        if: steps.scope.outputs.contracts == 'true'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Cache Foundry build artifacts
        if: steps.scope.outputs.contracts == 'true'
        uses: actions/cache@v4
        with:
          path: |
            packages/contracts/cache
            packages/contracts/out
          key: foundry-${{ runner.os }}-${{ hashFiles('packages/contracts/src/**/*.sol', 'packages/contracts/test/**/*.sol', 'packages/contracts/foundry.toml') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Install dependencies
        if: steps.scope.outputs.any_package_check == 'true'
        run: bun install --frozen-lockfile

      - name: Run scoped checks
        env:
          CI_SCOPE_FRONTEND: ${{ steps.scope.outputs.frontend }}
          CI_SCOPE_BACKEND: ${{ steps.scope.outputs.backend }}
          CI_SCOPE_UNIVERSE: ${{ steps.scope.outputs.universe }}
          CI_SCOPE_CONTRACTS: ${{ steps.scope.outputs.contracts }}
          CI_SCOPE_CIRCUITS: ${{ steps.scope.outputs.circuits }}
          CI_SCOPE_STORAGE_LAYOUT: ${{ steps.scope.outputs.storage_layout }}
          CI_SCOPE_FULL_BUILD: ${{ steps.scope.outputs.full_build }}
        run: |
          node scripts/ci-run-scoped-checks.mjs
