[phases.install]
cmds = ["bun install --frozen-lockfile && rm -rf /root/.cache/nix"]

[phases.build]
cmds = ["sh apps/backend/scripts/write-build-sha.sh && cd apps/backend && bun run build && rm -rf /root/.bun/install/cache /tmp/*"]

[start]
cmd = "cd apps/backend && bun run start"

[variables]
NODE_ENV = "production"
PORT = "4000"
