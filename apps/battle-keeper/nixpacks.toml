# Nixpacks build config for the Veydrift battle-keeper service.
# Build context is the monorepo root (workspaces resolve from there); set EasyPanel's build path to
# the repo root and point it at this file.

[phases.setup]
nixPkgs = []

# Node.js and Bun come from their own nixpkgs pin so they can take security
# releases without moving the rest of the setup (Node.js Oct 2026 security
# release: 22.23.4). nixpkgs only has Bun 1.3.13 at this pin, so its bun package
# is pointed at the official Bun 1.4.4 release (Oct 2026 security fixes); drop
# the override once nixpkgs has bun >= 1.4.4.
[phases.node]
nixPkgs = [
  "nodejs_22",
  "(bun.overrideAttrs { version = \"1.4.4\"; src = fetchurl { url = \"https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip\"; hash = \"sha256-v4zL+ysLgBWeD5ptFcVTF63YB3U028YTCj7bUvzLOVw=\"; }; })",
]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = ["NODE_ENV=development bun install --frozen-lockfile && rm -rf /root/.cache/nix"]

[phases.build]
# No bundling step — the keeper runs straight from TypeScript under Bun. Type-check so a broken
# build fails fast instead of at runtime.
cmds = ["cd apps/battle-keeper && bun run check && rm -rf /root/.bun/install/cache /tmp/*"]

[start]
cmd = "cd apps/battle-keeper && bun src/index.ts"

[variables]
NODE_ENV = "production"
