# Nixpacks build config for the Veydrift battle-keeper service.
# Build context is the monorepo root (workspaces resolve from there); set EasyPanel's build path to
# the repo root and point it at this file.

[phases.setup]
nixPkgs = ["bun"]

# Node.js comes from its own nixpkgs pin so it can take security releases without
# moving Bun or the rest of the setup (Node.js Oct 2026 security release: 22.23.4).
[phases.node]
nixPkgs = ["nodejs_22"]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.install]
cmds = ["NODE_ENV=development bun install --frozen-lockfile && rm -rf /root/.cache/nix"]

[phases.build]
# No bundling step — the keeper runs straight from TypeScript under Bun. Type-check so a broken
# build fails fast instead of at runtime.
cmds = ["cd apps/battle-keeper && bun run check && rm -rf /root/.bun/install/cache /tmp/*"]

[start]
cmd = "cd apps/battle-keeper && bun src/index.ts"

[variables]
NODE_ENV = "production"
