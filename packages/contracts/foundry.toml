[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1
via_ir = true
cbor_metadata = false
bytecode_hash = "none"
fs_permissions = [
  { access = "read-write", path = "./manifests" },
  { access = "read", path = "./combat-preview-catalog.json" }
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }

[fmt]
line_length = 100
tab_width = 4
