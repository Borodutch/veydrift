# Flush dirty pages early and in small chunks, so image-build output does not
# pile up in RAM (the defaults of 20/10 % allow ~50/25 GB on this host) and then
# reach the root disk in multi-GB bursts. ext4 metadata from builds that create
# many files is flushed by the kernel outside any cgroup cap; writing dirty data
# after 5 s instead of 30 s flushes it in smaller chunks.
# Undo: delete this file, then: sysctl -w vm.dirty_ratio=20 vm.dirty_background_ratio=10
#   vm.dirty_expire_centisecs=3000 vm.dirty_writeback_centisecs=500
vm.dirty_background_bytes = 268435456
vm.dirty_bytes = 4294967296
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 100
