name: CI

# PRs only. Branch protection requires the four `checks (<group>)` statuses and up-to-date
# branches (strict), so a PR
# merges only after passing on the exact tree that lands on main; a main run would repeat it.
on:
  pull_request:

# A new push to a PR cancels that PR's superseded run.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Check groups run as parallel jobs (one per Mac runner instance), so a run takes as long
  # as its slowest group instead of the sum of every check.
  # The job id must stay `check`: the Mac runners' job-started hook only authorizes job `check`
  # of this workflow, on pull_request events, for PRs authored by backmeupplz.
  check:
    name: checks (${{ matrix.group }})
    # Same rule as that hook, so other PRs (forks, other authors) use the Linux runner instead
    # of being denied on the Mac.
    # Each group has its own Mac runner (label veydrift-ci-<group>), so it always lands in the
    # workspace it warmed last time: node_modules, Foundry artifacts, pinned frontend media.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'backmeupplz') && fromJSON(format('["veydrift-backmeupplz-ci","veydrift-ci-{0}"]', matrix.group)) || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: rest
          - group: browser
          - group: contracts
          - group: contracts-checks
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # The PR's base commit: ci-scope.mjs checks what changed since its merge base with the head.
      BASE_REF: ${{ github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.sha }}
      PLAIN_VERSION: 0.4.0
    steps:
      # The Mac runners (host mode) give every job a new, empty workspace, so actions/checkout
      # re-downloaded ~60 MiB of blobs plus the contract submodules each time, and every ignored
      # build output was lost (full Foundry rebuilds, 420 MiB of frontend media). Instead each
      # runner instance keeps one blobless clone in its own tool cache (it runs one job at a time)
      # and the job workspace becomes a link to it: fetches are incremental, and node_modules,
      # Foundry out/cache and pinned frontend media stay warm. Other untracked leftovers are removed.
      - name: Check out repository (persistent Mac workspace)
        if: runner.os == 'macOS'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ws="$RUNNER_TOOL_CACHE/veydrift-workspace"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
          if [ ! -d "$ws/.git" ]; then
            rm -rf "$ws" && git init -q "$ws"
            git -C "$ws" remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            git -C "$ws" config remote.origin.promisor true
            git -C "$ws" config remote.origin.partialclonefilter blob:none
          fi
          cd "$ws"
          rm -f .git/index.lock
          git fetch -q --no-tags --filter=blob:none origin "+$HEAD_REF:refs/ci/head" "+$BASE_REF:refs/ci/base"
          git checkout -q --force --detach "$HEAD_REF"
          git clean -ffdq
          git submodule sync -q --recursive
          git submodule update -q --init --force --recursive --depth=1
          git submodule foreach -q --recursive git clean -ffdq
          git log -1 --format='%H %s'
          rm -rf "$GITHUB_WORKSPACE" && ln -s "$ws" "$GITHUB_WORKSPACE"

      # Other runners (fork PRs) start from a fresh workspace.
      - name: Check out repository
        if: runner.os != 'macOS'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
          # packages/contracts/lib (OpenZeppelin, forge-std)
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test CI scope and output guards
        if: matrix.group == 'rest'
        run: node --test scripts/ci-run-scoped-checks.test.mjs

      # Only the areas a change touches (plus what depends on them) are checked;
      # toolchain/CI/unclassified changes check everything.
      - name: Plan this group's checks
        id: plan
        run: |
          node scripts/ci-scope.mjs
          planned="$(node scripts/ci-run-scoped-checks.mjs --group "${{ matrix.group }}" --list | grep -v ' (Skipped' || true)"
          echo "$planned"
          needs_packages="$(printf '%s\n' "$planned" | grep -v -e '^docs-' -e '^$' || true)"
          echo "work=$([ -n "$needs_packages" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docs=$([ -n "$planned" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "foundry=$(printf '%s\n' "$planned" | grep -q '^contracts-' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(printf '%s\n' "$planned" | grep -q '^frontend-' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.plan.outputs.work == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Each runner instance has its own tool cache and runs one job at a time, so a missing
      # Foundry is installed there once (checked against the release's .sha256) without racing.
      - name: Use the runner's Foundry
        if: steps.plan.outputs.foundry == 'true'
        run: |
          dir="$RUNNER_TOOL_CACHE/foundry/1.7.1"
          if ! "$dir/forge" --version 2>/dev/null | grep -q 'Version: 1.7.1'; then
            case "$(uname -s)/$(uname -m)" in
              Darwin/arm64) target=darwin_arm64 ;;
              Linux/x86_64) target=linux_amd64 ;;
              *) echo "::error::No Foundry release for $(uname -s) $(uname -m)"; exit 1 ;;
            esac
            base="https://github.com/foundry-rs/foundry/releases/download/v1.7.1/foundry_v1.7.1_$target"
            curl -fsSL -o "$RUNNER_TEMP/foundry.tar.gz" "$base.tar.gz"
            want="$(curl -fsSL "$base.sha256" | cut -d' ' -f1)"
            got="$( (sha256sum "$RUNNER_TEMP/foundry.tar.gz" 2>/dev/null || shasum -a 256 "$RUNNER_TEMP/foundry.tar.gz") | cut -d' ' -f1)"
            [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::Foundry 1.7.1 doesn't match its .sha256"; exit 1; }
            rm -rf "$dir" && mkdir -p "$dir" && tar -xzf "$RUNNER_TEMP/foundry.tar.gz" -C "$dir"
          fi
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/forge" --version

      # plain (getplain.org) runs the contract tests and the size and storage-layout checks; Foundry
      # still formats, builds out/ and runs anvil.
      # Like Foundry, plain is installed once per runner tool cache, at a path per version.
      # CI keeps its own PLAIN_HOME (solc, test-result cache) so local and dev builds on this Mac never
      # feed results into CI.
      - name: Use the runner's plain
        if: steps.plan.outputs.foundry == 'true'
        run: |
          dir="$RUNNER_TOOL_CACHE/plain/$PLAIN_VERSION"
          "$dir/plain" --version 2>/dev/null | grep -qx "plain $PLAIN_VERSION" \
            || { rm -rf "$dir" && scripts/install-plain.sh "$PLAIN_VERSION" "$dir"; }
          echo "$dir" >> "$GITHUB_PATH"
          echo "PLAIN_HOME=$HOME/.plain-ci" >> "$GITHUB_ENV"

      # Full Chrome crashes at launch (SIGTRAP) under the runners' hidden daemon user, which has no
      # GUI session. The browser tests take CHROME_PATH, so point them at Chrome for Testing's
      # headless-only build, installed once per runner tool cache.
      - name: Use the runner's headless Chrome
        if: steps.plan.outputs.frontend == 'true' && runner.os == 'macOS'
        run: |
          version=155.0.8059.86
          dir="$RUNNER_TOOL_CACHE/chrome-headless-shell/$version"
          bin="$dir/chrome-headless-shell-mac-arm64/chrome-headless-shell"
          if [ ! -x "$bin" ]; then
            curl -fsSL -o "$RUNNER_TEMP/chs.zip" "https://storage.googleapis.com/chrome-for-testing-public/$version/mac-arm64/chrome-headless-shell-mac-arm64.zip"
            rm -rf "$dir" && mkdir -p "$dir" && unzip -q "$RUNNER_TEMP/chs.zip" -d "$dir"
          fi
          "$bin" --version
          echo "CHROME_PATH=$bin" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.plan.outputs.work == 'true'
        run: bun install --frozen-lockfile

      - name: Run scoped checks
        if: steps.plan.outputs.docs == 'true'
        run: |
          node scripts/ci-run-scoped-checks.mjs --group "${{ matrix.group }}"
